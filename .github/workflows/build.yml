name: Build and Test WAR Application

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build WAR file
        run: mvn clean package -Dmaven.test.skip=true

      - name: Verify WAR file
        run: ls -lh target/*.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war
          if-no-files-found: error
          retention-days: 7

  test-application:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./deploy
          
      - name: Install Tomcat
        run: |
          sudo apt-get update
          sudo apt-get install -y tomcat10

      - name: Deploy WAR
        run: |
          ls -lh ./deploy/
          sudo cp ./deploy/*.war /var/lib/tomcat10/webapps/ROOT.war

      - name: Start Tomcat
        run: |
          sudo systemctl start tomcat10
          sudo systemctl status tomcat10 --no-pager || true

      - name: Test application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/; then
              echo "Application responded successfully"
              exit 0
            fi
            echo "Waiting for Tomcat..."
            sleep 2
          done

          echo "Tomcat or application failed to respond"
          sudo journalctl -u tomcat10 --no-pager -n 100 || true
          sudo tail -n 100 /var/log/tomcat10/catalina.out || true
          exit 1
